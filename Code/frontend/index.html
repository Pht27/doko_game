<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="My Awesome App description">
    <link rel="apple-touch-icon" href="/icon192.png" sizes="192x192">
    <link rel="mask-icon" href="/icons.svg" color="#FFFFFF">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <script>
      (function () {
        var n = localStorage.getItem('doko-theme-neutral') || 'navy';
        var a = localStorage.getItem('doko-theme-accent') || 'indigo';
        document.documentElement.classList.add('neutral-' + n, 'accent-' + a);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
