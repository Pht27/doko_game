doko:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5432
      dbname: doko
      user: postgres
      password: postgres
      schema: analytics
      threads: 1
    prod:
      type: postgres
      host: postgres
      port: 5432
      dbname: doko_analog
      user: doko_app
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      schema: analytics
      threads: 1
    staging:
      type: postgres
      host: postgres
      port: 5432
      dbname: doko_analog_staging
      user: doko_app
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      schema: analytics
      threads: 1
