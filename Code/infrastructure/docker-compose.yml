services:
  # =========================
  # CADDY (single entrypoint)
  # =========================
  caddy:
    image: caddy:alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - /root/opt/doko-frontend:/srv
      - /root/opt/doko-staging-frontend:/srv-staging
    depends_on:
      - backend
      - backend-staging
    networks:
      - doko-net
    restart: unless-stopped

  # =========================
  # POSTGRESQL
  # =========================
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=doko_analog
      - POSTGRES_USER=doko_app
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - doko-net
    restart: unless-stopped

  # =========================
  # BACKEND PROD
  # =========================
  backend:
    container_name: backend
    build:
      context: ../..
      dockerfile: Code/infrastructure/backend/Dockerfile
    environment:
      - Jwt__Key=${JWT_SECRET}
      - ConnectionStrings__Analog=Host=postgres;Database=doko_analog;Username=doko_app;Password=${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - doko-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # =========================
  # BACKEND STAGING
  # =========================
  backend-staging:
    container_name: backend-staging
    build:
      context: /root/opt/doko-staging
      dockerfile: Code/infrastructure/backend/Dockerfile
    environment:
      - Jwt__Key=${JWT_SECRET}
      - ConnectionStrings__Analog=Host=postgres;Database=doko_analog_staging;Username=doko_app;Password=${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    networks:
      - doko-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  caddy_data:
  postgres_data:

networks:
  doko-net:
    external: true
