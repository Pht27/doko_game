name: doko
version: '1.0.0'
config-version: 2
profile: doko

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

on-run-start:
  - "CREATE SCHEMA IF NOT EXISTS {{ target.schema }}"

models:
  doko:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: view
